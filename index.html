      {

        lanjut: [

        ],

        dialog: [

    // ---------- BOSS RAHASIA (3) ----------
    // [nama, hp, atk, xp, gold, level_minimal, kalimat_pembuka]
    const RAHASIA = [
      { id: "lich", data: ["Lich Abadi Malakar", 450, 30, 300, 250, 7,
        "Peti-peti batu terbuka. Ribuan kerangka bangkit mengelilingi Lich Abadi Malakar!"] },
      { id: "hydra", data: ["Hydra Jurang Nestapa", 650, 34, 450, 400, 9,
        "Air hitam menggelegak, sembilan kepala Hydra menyembur dari jurang!"] },
      { id: "titan", data: ["Titan Api Purba Ignaros", 900, 40, 700, 600, 11,
        "Inti dungeon retak. Titan Api Purba Ignaros bangkit, dunia menjadi merah membara!"] }
    ];

    // ---------- MONSTER RAHASIA (muncul sangat jarang saat menjelajah, min. Level 3) ----------
    const NAMBO = [ "Nambo Rafif GoG", 170, 22, 120, 120, 3,
      "Kabut aneh turun... sesosok misterius bernama Nambo Rafif GoG muncul sambil tertawa!"];

    // =====================================================
    //   SUARA & MUSIK (gaya chiptune 8-bit, dibuat dengan kode - tanpa file audio)
    // =====================================================
    const Suara = (() => {
      let ctx = null, mus = null, sfx = null;
      let musikOn = true, sfxOn = true;
      let mode = "diam", step = 0, nextT = 0, timer = null;

      const hz = m => 440 * Math.pow(2, (m - 69) / 12);

      // 0 = jeda, 1 = tahan nada sebelumnya. 1 langkah = not 1/8
      const TRACK = {
        menu: {
          tempo: 100, leadType: "square", leadG: 0.16, bassType: "triangle", bassG: 0.5, drum: false,
          lead: [69,1,72,1,76,1,72,0,  65,1,69,1,72,1,69,0,  67,1,71,1,74,1,71,0,  64,1,68,1,71,1,76,1],
          bass: [45,1,1,0,52,1,1,0,    41,1,1,0,48,1,1,0,    43,1,1,0,50,1,1,0,    40,1,1,0,47,1,1,0]
        },
        battle: {
          tempo: 160, leadType: "square", leadG: 0.16, bassType: "triangle", bassG: 0.5,
          drum: true, kick: [0], snare: [4],
          lead: [76,0,76,74,72,0,74,76,  77,0,77,76,74,0,72,74,  74,0,74,72,71,0,72,74,  76,1,1,0,80,1,76,1],
          bass: [45,45,57,45,45,57,45,57,  41,41,53,41,41,53,41,53,  43,43,55,43,43,55,43,55,  40,40,52,40,40,52,40,52]
        },
        boss: {
          tempo: 176, leadType: "sawtooth", leadG: 0.13, bassType: "square", bassG: 0.18,
          drum: true, kick: [0, 3, 6], snare: [4],
          lead: [74,74,0,77,81,0,77,74,  70,70,0,74,77,0,74,70,  72,72,0,76,79,0,76,72,  69,73,76,81,80,1,76,73],
          bass: [38,38,50,38,38,50,38,50,  34,34,46,34,34,46,34,46,  36,36,48,36,36,48,36,48,  33,33,45,33,33,45,33,45]
        },
        seram: {
          tempo: 70, leadType: "triangle", leadG: 0.12, bassType: "sawtooth", bassG: 0.12, drum: false,
          lead: [66,1,1,1,1,1,1,0,  67,1,1,1,1,1,1,0,  66,1,1,1,1,1,0,0,  72,1,1,1,1,1,1,1],
          bass: [30,1,1,1,1,1,1,1,  31,1,1,1,1,1,1,1,  30,1,1,1,1,1,1,1,  36,1,1,1,1,1,1,1]
        }
      };

      function init() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ctx = new AC();
          const master = ctx.createGain();
          master.gain.value = 0.6;
          master.connect(ctx.destination);
          mus = ctx.createGain(); mus.gain.value = 0.5; mus.connect(master);
          sfx = ctx.createGain(); sfx.gain.value = 0.6; sfx.connect(master);
        }
        if (ctx.state === "suspended") ctx.resume();
        mulaiJadwal();
      }

      // satu nada dengan envelope; "ke" = geser frekuensi ke nada lain
      function nada(f, t, d, type, g, dest, ke) {
        const o = ctx.createOscillator(), a = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        if (ke) o.frequency.exponentialRampToValueAtTime(ke, t + d);
        a.gain.setValueAtTime(0.0001, t);
        a.gain.exponentialRampToValueAtTime(g, t + 0.01);
        a.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(a); a.connect(dest);
        o.start(t); o.stop(t + d + 0.03);
      }

      function bising(t, d, g, dest, hp) {
        const n = Math.max(1, Math.floor(ctx.sampleRate * d));
        const buf = ctx.createBuffer(1, n, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
        const s = ctx.createBufferSource(); s.buffer = buf;
        const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 1000;
        const a = ctx.createGain();
        a.gain.setValueAtTime(g, t);
        a.gain.exponentialRampToValueAtTime(0.0001, t + d);
        s.connect(f); f.connect(a); a.connect(dest);
        s.start(t);
      }

      function arp(daftar, t, langkah, type, g) {
        daftar.forEach((m, i) => { if (m) nada(hz(m), t + i * langkah, langkah * 1.6, type, g, sfx); });
      }

      // ---------- efek suara ----------
      const SFX = {
        klik(t)  { nada(hz(84), t, 0.04, "square", 0.1, sfx); },
        serang(t) {
          bising(t, 0.12, 0.5, sfx, 2000);
          nada(hz(76), t, 0.12, "sawtooth", 0.25, sfx, hz(52));
        },
        crit(t) {
          bising(t, 0.18, 0.6, sfx, 1500);
          nada(hz(88), t, 0.2, "square", 0.3, sfx, hz(60));
          arp([84, 88, 91, 96], t + 0.05, 0.05, "square", 0.2);
        },
        skillPendekar(t) {
          nada(hz(60), t, 0.35, "sawtooth", 0.22, sfx, hz(96));
          arp([84, 88, 91, 96], t + 0.2, 0.06, "triangle", 0.3);
          bising(t + 0.25, 0.2, 0.4, sfx, 3000);
        },
        skillPenyihir(t) {
          arp([69, 72, 76, 81, 84, 88, 93], t, 0.055, "triangle", 0.3);
          nada(hz(45), t, 0.5, "sawtooth", 0.12, sfx, hz(57));
          bising(t + 0.3, 0.3, 0.3, sfx, 800);
        },
        skillPemanah(t) {
          for (let i = 0; i < 3; i++) {
            bising(t + i * 0.1, 0.08, 0.35, sfx, 3000);
            nada(hz(90), t + i * 0.1, 0.08, "square", 0.18, sfx, hz(70));
          }
        },
        skillTombak(t) {
          nada(hz(96), t, 0.15, "square", 0.3, sfx, hz(48));
          nada(hz(40), t + 0.1, 0.25, "sawtooth", 0.25, sfx, hz(28));
          bising(t, 0.25, 0.5, sfx, 1200);
          arp([79, 91, 84, 96], t + 0.1, 0.03, "square", 0.15);
        },
        kena(t) {
          nada(hz(52), t, 0.25, "square", 0.3, sfx, hz(30));
          bising(t, 0.15, 0.5, sfx, 300);
        },
        heal(t)  { arp([60, 64, 67, 72, 76], t, 0.07, "triangle", 0.35); },
        mp(t)    { arp([72, 79, 84, 91], t, 0.06, "triangle", 0.3); },
        kabur(t) { arp([72, 67, 64, 60, 55], t, 0.05, "square", 0.2); },
        gagal(t) {
          nada(hz(45), t, 0.2, "square", 0.25, sfx, hz(40));
          nada(hz(43), t + 0.18, 0.25, "square", 0.25, sfx);
        },
        muncul(t) { nada(hz(45), t, 0.35, "sawtooth", 0.25, sfx, hz(33)); },
        boss(t) {
          nada(hz(33), t, 0.9, "sawtooth", 0.3, sfx, hz(26));
          nada(hz(34), t, 0.9, "square", 0.15, sfx, hz(27));
          bising(t, 0.9, 0.25, sfx, 200);
          arp([50, 50, 53, 50, 56], t + 0.9, 0.12, "square", 0.2);
        },
        levelUp(t) { arp([72, 76, 79, 84, 79, 84, 88, 91, 96], t, 0.08, "square", 0.22); },
        menang(t)  { arp([72, 76, 79, 84, 0, 79, 84, 88, 91, 96], t, 0.1, "square", 0.25); },
        menangBoss(t) {
          arp([60, 64, 67, 72, 76, 79, 84, 0, 79, 84, 88, 91, 96, 0, 96, 96, 100], t, 0.12, "square", 0.25);
          arp([48, 0, 52, 0, 55, 0, 60], t, 0.24, "triangle", 0.4);
        },
        kalah(t) { arp([69, 67, 64, 62, 57, 52, 45], t, 0.25, "triangle", 0.4); },
        beli(t) {
          nada(hz(83), t, 0.07, "square", 0.25, sfx);
          nada(hz(88), t + 0.07, 0.25, "square", 0.25, sfx);
        },
        latih(t) {
          nada(hz(45), t, 0.12, "square", 0.3, sfx, hz(35));
          arp([72, 76], t + 0.12, 0.08, "triangle", 0.3);
        },
        istirahat(t) { arp([60, 64, 67, 72, 67, 72, 76], t, 0.12, "triangle", 0.3); },
        jantung(t) {
          nada(hz(30), t, 0.18, "sine", 0.7, sfx, hz(24));
          nada(hz(30), t + 0.22, 0.22, "sine", 0.6, sfx, hz(24));
        },
        bisik(t) {
          bising(t, 1.2, 0.08, sfx, 3500);
          nada(hz(70), t + 0.2, 0.9, "sine", 0.04, sfx, hz(66));
        },
        drone(t) {
          nada(hz(30), t, 1.8, "sawtooth", 0.18, sfx, hz(28));
          nada(hz(31), t, 1.8, "sawtooth", 0.18, sfx, hz(29));
          nada(hz(66), t + 0.4, 1.2, "triangle", 0.1, sfx, hz(60));
        },
        jeritan(t) {
          nada(hz(96), t, 0.7, "sawtooth", 0.18, sfx, hz(70));
          nada(hz(93), t, 0.7, "square", 0.1, sfx, hz(66));
          bising(t, 0.7, 0.3, sfx, 2500);
        }
      };

      function main(nama, tunda) {
        if (!ctx || !sfxOn || !SFX[nama]) return;
        SFX[nama](ctx.currentTime + (tunda || 0));
      }

      // ---------- musik latar ----------
      function lenAt(arr, i) {
        let n = 1;
        while (n < arr.length && arr[(i + n) % arr.length] === 1) n++;
        return n;
      }

      function langkah(tr, i, t, dt) {
        const L = tr.lead[i], B = tr.bass[i];
        if (L > 1) nada(hz(L), t, lenAt(tr.lead, i) * dt * 0.92, tr.leadType, tr.leadG, mus);
        if (B > 1) nada(hz(B), t, lenAt(tr.bass, i) * dt * 0.92, tr.bassType, tr.bassG, mus);
        if (tr.drum) {
          const k = i % 8;
          if (tr.kick.includes(k)) nada(150, t, 0.12, "sine", 0.7, mus, 40);
          if (tr.snare.includes(k)) bising(t, 0.1, 0.35, mus, 1500);
          if (i % 2 === 1) bising(t, 0.03, 0.15, mus, 6000);
        }
      }

      function jadwal() {
        const tr = TRACK[mode];
        if (!tr || !ctx || !musikOn) { timer = null; return; }
        const dt = 60 / tr.tempo / 2;
        if (nextT < ctx.currentTime - 0.5) nextT = ctx.currentTime + 0.05;
        while (nextT < ctx.currentTime + 0.2) {
          langkah(tr, step, nextT, dt);
          nextT += dt;
          step = (step + 1) % tr.lead.length;
        }
        timer = setTimeout(jadwal, 50);
      }

      function mulaiJadwal() {
        if (!ctx || !musikOn || mode === "diam" || timer) return;
        step = 0;
        nextT = ctx.currentTime + 0.05;
        jadwal();
      }

      function hentiJadwal() {
        clearTimeout(timer);
        timer = null;
      }

      function musik(m) {
        if (m === mode) return;
        mode = m;
        hentiJadwal();
        mulaiJadwal();
      }

      function toggleMusik() {
        musikOn = !musikOn;
        if (musikOn) mulaiJadwal(); else hentiJadwal();
        return musikOn;
      }

      function toggleSuara() {
        sfxOn = !sfxOn;
        return sfxOn;
      }

      return { init, main, musik, toggleMusik, toggleSuara };
    })();

    // =====================================================
    //   STATE & ELEMEN
    // =====================================================
    let p = null;   // pemain
    let m = null;   // musuh saat ini
    let kes = KESULITAN[1];

    const elStatus = document.getElementById("status");
    const elMusuh = document.getElementById("musuh");
    const elLog = document.getElementById("log");
    const elAksi = document.getElementById("aksi");
    const elNamaWrap = document.getElementById("nama-wrap");
    const elNama = document.getElementById("nama");

    const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
    const biaya = x => Math.ceil(x * kes.stam);   // biaya stamina sesuai kesulitan
    const atkTotal = () => p.atk + WEAPON[p.wep].atk;
    const cm = () => kes.nama === "Super Hard" ? Math.min(p.critMult, 1.5) : p.critMult;  // Super Hard: critical tidak dikali dua

    // ---------- EFEK SERAM ----------
    const Horor = {
      set(on) { document.body.classList.toggle("horor", on); },
      getar() {
        const b = document.body;
        b.classList.remove("getar"); void b.offsetWidth; b.classList.add("getar");
        setTimeout(() => b.classList.remove("getar"), 400);
      },
      kilat() {
        const k = document.getElementById("kilat");
        k.classList.remove("nyala"); void k.offsetWidth; k.classList.add("nyala");
      }
    };

    function tulis(teks, cls) {
      const e = document.createElement("p");
      e.textContent = teks;
      if (cls) e.className = cls;
      elLog.appendChild(e);
      while (elLog.children.length > 250) elLog.removeChild(elLog.firstChild);
      elLog.scrollTop = elLog.scrollHeight;
    }

    function tombol(daftar) {
      elAksi.innerHTML = "";
      daftar.forEach(([teks, fn, mati]) => {
        const b = document.createElement("button");
        b.textContent = teks;
        b.disabled = !!mati;
        b.onclick = () => { Suara.main("klik"); fn(); };
        elAksi.appendChild(b);
      });
    }

    function bar(label, nilai, maks) {
      const persen = Math.max(0, Math.min(100, (nilai / maks) * 100));
      return `<div class="bar-label"><span>${label}</span><span>${nilai}/${maks}</span></div>
              <div class="bar"><div style="width:${persen}%"></div></div>`;
    }

    function render() {
      if (!p) return;
      document.body.classList.toggle("lowhp", !!m && p.hp < p.hpMax * 0.3);
      elStatus.classList.remove("hidden");
      elStatus.innerHTML = `
        <h2>${p.nama} - ${p.kelas}</h2>
        <div class="baris"><span>${p.gelar}</span><span>Level ${p.level}</span></div>
        <div class="baris"><span>Kesulitan: ${kes.nama}</span><span>Pendamping: ${p.kawan.length}</span></div>
        ${bar("HP", p.hp, p.hpMax)}
        ${bar("MP", p.mp, p.mpMax)}
        ${bar("Stamina", p.st, p.stMax)}
        ${bar("XP", p.xp, p.level * 30)}
        <div class="baris" style="margin-top:8px">
          <span>ATK ${atkTotal()}</span>
          <span>DEF ${ARMOR[p.arm].def}</span>
          <span>Critical ${p.crit}% (x${cm()})</span>
        </div>
        <div class="baris"><span>${WEAPON[p.wep].nama}</span><span>${ARMOR[p.arm].nama}</span></div>
        <div class="baris">
          <span>Gold ${p.gold}</span>
          <span>Potion ${p.potion}</span>
          <span>Ether ${p.ether}</span>
          <span>Roti ${p.roti}</span>
        </div>`;
      if (m) {
        elMusuh.classList.remove("hidden");
        elMusuh.innerHTML = `<h2>${m.nama}</h2>${bar("HP", Math.max(0, m.hp), m.hpMax)}`;
      } else {
        elMusuh.classList.add("hidden");
      }
    }

    // =====================================================
    //   MULAI GAME
    // =====================================================
    function layarKelas() {
      p = null; m = null;
      Horor.set(false); document.body.classList.remove("lowhp");
      Suara.musik("menu");
      elStatus.classList.add("hidden");
      elMusuh.classList.add("hidden");
      elNamaWrap.classList.remove("hidden");
      elLog.innerHTML = "";
      tulis("Pilih jalan takdirmu, wahai pahlawan:", "penting");
      KELAS.forEach(k => {
        tulis(`${k.nama} - ${k.gelar}`, "penting");
        tulis(`  HP ${Math.round(k.hp * 0.6)} | MP ${Math.round(k.mp * 0.5)} | ATK ${k.atk} | Skill: ${k.skill} (${k.skillMp} MP)`);
        tulis(`  ${k.info}`);
      });
      tombol(KELAS.map(k => [k.nama, () => pilihKesulitan(k)]));
    }

    function pilihKesulitan(k) {
      elLog.innerHTML = "";
      tulis(`Kelas: ${k.nama}. Pilih tingkat kesulitan:`, "penting");
      KESULITAN.forEach(d => tulis(`${d.nama} - ${d.info}`));
      tombol([...KESULITAN.map(d => [d.nama, () => mulai(k, d)]), ["Kembali", layarKelas]]);
    }

    function mulai(k, d) {
      kes = d;
      p = {
        nama: elNama.value.trim() || "Hero",
        kelas: k.nama, gelar: k.gelar,
        level: 1, xp: 0,
        hp: Math.round(k.hp * 0.6), hpMax: Math.round(k.hp * 0.6),
        mp: Math.round(k.mp * 0.5), mpMax: Math.round(k.mp * 0.5),
        st: 40, stMax: 40,
        atk: k.atk, crit: k.crit, critMult: k.critMult,
        dmg: k.dmg, naik: k.naik,
        skill: k.skill, skillMp: k.skillMp, serang: k.serang,
        gold: 20, potion: 1, ether: 0, roti: 1,
        wep: 0, arm: 0,
        kawan: [], bicara: {}, buka: {}, tumbang: {}
      };
      elNamaWrap.classList.add("hidden");
      elLog.innerHTML = "";
      tulis(`Selamat datang, ${p.nama} sang ${p.gelar}! (Kesulitan: ${kes.nama})`, "penting");
      tulis("Kamu memulai dengan tubuh lemah dan perbekalan seadanya. Jaga stamina-mu!");
      menuUtama();
    }

    // =====================================================
    //   MENU UTAMA
    // =====================================================
    function menuUtama() {
      m = null;
      Horor.set(false);
      Suara.musik("menu");
      render();
      const adaRahasia = RAHASIA.some(r => p.buka[r.id]);
      const daftar = [
        [`Jelajah dungeon (-${biaya(5)} stamina)`, () => jelajah(), p.st < biaya(5)],
        ["Duduk sebentar (+8 stamina, gratis)", duduk],
        ["Toko Alkemis & Pandai Besi", menuToko],
        ["Toko Budak (pendamping)", menuBudak],
        ["Bicara dengan Budak", menuBicara, p.kawan.length === 0],
        [`Istirahat (${kes.inap} gold)`, istirahat],
        ["Berlatih", menuLatih],
        ["LAWAN BOSS: Naga Raja", () => mulaiBattle(BOSS, true), p.level < 5]
      ];
      if (adaRahasia) daftar.push(["BOSS RAHASIA", menuRahasia]);
      daftar.push(["Mulai ulang", layarKelas]);
      tombol(daftar);
    }

    function jelajah() {
      p.st -= biaya(5);
      mulaiBattle(monsterAcak(), false);
    }

    function duduk() {
      p.st = Math.min(p.stMax, p.st + 8);
      Suara.main("mp");
      tulis("Kamu duduk bersandar di dinding dungeon dan mengatur napas. Stamina +8.");
      if (Math.random() < 0.2) {
        tulis("Suara langkah mendekat... kamu disergap saat lengah!", "penting");
        return mulaiBattle(monsterAcak(), false);
      }
      menuUtama();
    }

    function istirahat() {
      if (p.gold >= kes.inap) {
        p.gold -= kes.inap;
        p.hp = p.hpMax; p.mp = p.mpMax; p.st = p.stMax;
        Suara.main("istirahat");
        tulis(`Kamu istirahat di penginapan (-${kes.inap} gold). HP, MP & Stamina pulih penuh!`);
      } else {
        Suara.main("gagal");
        tulis(`Gold tidak cukup (butuh ${kes.inap}).`);
      }
      render();
    }

    function monsterAcak() {
      if (p.level >= 3 && Math.random() < 0.05) return NAMBO;
      const kandidat = MONSTER.filter(x => x[5] <= p.level + 1);
      return kandidat[rand(0, kandidat.length - 1)];
    }

    // =====================================================
    //   LEVEL
    // =====================================================
    function naikLevel() {
      while (p.xp >= p.level * 30) {
        p.xp -= p.level * 30;
        p.level++;
        const [h, a, mp] = p.naik;
        p.hpMax += h; p.mpMax += mp; p.atk += a; p.stMax += 3;
        if (p.crit < CRIT_MAKS) p.crit++;
        p.hp = p.hpMax; p.mp = p.mpMax; p.st = p.stMax;
        Suara.main("levelUp", 0.3);
        tulis(`*** LEVEL UP! Sekarang Level ${p.level}! ***`, "penting");
        tulis(`HP +${h} | MP +${mp} | ATK +${a} | Stamina max +3 | Critical +1% | Semua pulih penuh!`);
      }
    }

    // =====================================================
    //   SERANGAN
    // =====================================================
    function satuSerangan(mult = 1, paksaCrit = false) {
      const [lo, hi] = p.dmg;
      const a = atkTotal();
      let d = rand(Math.max(1, a + lo), a + hi) * mult;
      const crit = paksaCrit || Math.random() * 100 < p.crit;
      if (crit) d *= cm();
      return { d: Math.max(1, Math.floor(d)), crit };
    }

    function serangBiasa() {
      const { d, crit } = satuSerangan();
      Suara.main(crit ? "crit" : "serang");
      tulis(`Kamu ${p.serang} ke ${m.nama}!`);
      if (crit) tulis(`CRITICAL HIT! (x${cm()})`, "crit");
      tulis(`${m.nama} menerima ${d} damage.`);
      p.mp = Math.min(p.mpMax, p.mp + 4);
      return d;
    }

    function pakaiSkill() {
      p.mp -= p.skillMp;
      Suara.main("skill" + p.kelas);
      let total = 0;
      if (p.kelas === "Pendekar") {
        tulis(`Pedangmu berpendar putih... '${p.skill}'!`, "penting");
        const r = satuSerangan(1.8);
        total = r.d;
        tulis(`Tebasan cahaya membelah ${m.nama}!` + (r.crit ? " CRITICAL!" : ""), r.crit ? "crit" : "");
      } else if (p.kelas === "Penyihir") {
        tulis(`Lingkaran sihir bintang muncul di kakimu... '${p.skill}'!`, "penting");
        const r = satuSerangan(2.2);
        total = r.d;
        tulis(`Badai api arkana melahap ${m.nama}!` + (r.crit ? " CRITICAL!" : ""), r.crit ? "crit" : "");
      } else if (p.kelas === "Pemanah") {
        tulis(`Kamu menarik busur ke langit... '${p.skill}'!`, "penting");
        for (let i = 1; i <= 3; i++) {
          const r = satuSerangan(0.8);
          total += r.d;
          tulis(`  Panah ${i}: ${r.d} damage` + (r.crit ? " (CRITICAL!)" : ""), r.crit ? "crit" : "");
        }
      } else {
        tulis(`Petir menyambar ujung tombakmu... '${p.skill}'!`, "penting");
        const r = satuSerangan(1.3, true);
        total = r.d;
        tulis(`Tusukan naga langit menembus ${m.nama}! CRITICAL PASTI!`, "crit");
      }
      tulis(`Total ${total} damage ke ${m.nama}.`);
      return total;
    }

    // =====================================================
    //   PERTARUNGAN
    // =====================================================
    function mulaiBattle(data, boss, rahasia) {
      let [nama, hp, atk, xp, gold, , intro] = data;
      if (boss) {
        const bm = 0.7 + 0.3 * kes.musuh;   // boss ikut kesulitan, tapi lebih ringan
        hp = Math.floor(hp * bm);
        atk = Math.floor(atk * bm);
      } else {
        const skala = (1 + (p.level - 1) * 0.15) * kes.musuh;
        hp = Math.floor(hp * skala);
        atk = Math.floor(atk * skala);
        xp = Math.floor(xp * (1 + (p.level - 1) * 0.15));
        gold = Math.floor(gold * (1 + (p.level - 1) * 0.15) * kes.gold);
      }
      m = { nama, hp, hpMax: hp, atk, xp, gold, boss, rahasia: rahasia || null, giliran: 0 };
      const horor = boss || nama === NAMBO[0] || kes.nama === "Super Hard";
      m.horor = horor;
      Horor.set(horor);
      Suara.musik(horor ? "seram" : "battle");
      Suara.main(boss ? "boss" : horor ? "drone" : "muncul");
      if (horor) { Suara.main("bisik", 0.6); Horor.kilat(); }
      tulis(intro, "pembatas");
      tulis(`Kamu bertemu ${nama}! (HP ${hp}, ATK ${atk})`, "penting");
      if (horor) tulis("Layar menggelap... udara membeku dan sesuatu berbisik di telingamu.", "penting");
      menuBattle();
    }

    function menuBattle() {
      render();
      const sSerang = biaya(6), sSkill = biaya(10), sKabur = biaya(8);
      tombol([
        [`Serang (-${sSerang} stamina)`, () => aksiBattle("serang"), p.st < sSerang],
        [`Skill: ${p.skill} (${p.skillMp} MP, -${sSkill} stamina)`, () => aksiBattle("skill"), p.mp < p.skillMp || p.st < sSkill],
        ["Atur napas (+15 stamina, tanpa menyerang)", () => aksiBattle("napas")],
        [`Potion +50 HP (${p.potion})`, () => aksiBattle("potion"), p.potion <= 0],
        [`Ether +30 MP (${p.ether})`, () => aksiBattle("ether"), p.ether <= 0],
        [`Roti +30 stamina (${p.roti})`, () => aksiBattle("roti"), p.roti <= 0],
        [`Kabur (-${sKabur} stamina)`, () => aksiBattle("kabur"), m.boss || p.st < sKabur]
      ]);
    }

    function aksiKawan() {
      p.kawan.forEach(id => {
        const k = KAWAN.find(x => x.id === id);
        if (m.horor && Math.random() < 0.35) { tulis(k.takut[rand(0, k.takut.length - 1)], "penting"); Suara.main("bisik"); }
        if (k.tipe === "serang") {
          const d = 3 + Math.floor(p.level / 2) + rand(0, 3);
          m.hp -= d;
          tulis(`${k.nama} menerkam ${m.nama}! ${d} damage.`);
        } else if (k.tipe === "heal") {
          const h = 6 + p.level;
          p.hp = Math.min(p.hpMax, p.hp + h);
          tulis(`${k.nama} merapal cahaya hijau, HP +${h}.`);
        } else {
          const d = 2 + Math.floor(p.level / 2);
          m.hp -= d;
          p.st = Math.min(p.stMax, p.st + 3);
          tulis(`${k.nama} memanah ${m.nama} (${d} damage) dan membantumu bernapas, stamina +3.`);
        }
      });
    }

    function aksiBattle(jenis) {
      if (jenis === "serang") {
        p.st -= biaya(6);
        m.hp -= serangBiasa();
      } else if (jenis === "skill") {
        p.st -= biaya(10);
        m.hp -= pakaiSkill();
      } else if (jenis === "napas") {
        p.st = Math.min(p.stMax, p.st + 15);
        Suara.main("mp");
        tulis("Kamu menarik napas dalam-dalam dan menjaga jarak. Stamina +15.");
      } else if (jenis === "potion") {
        p.potion--;
        p.hp = Math.min(p.hpMax, p.hp + 50);
        Suara.main("heal");
        tulis("Kamu meminum ramuan merah, HP pulih +50.");
      } else if (jenis === "ether") {
        p.ether--;
        p.mp = Math.min(p.mpMax, p.mp + 30);
        Suara.main("mp");
        tulis("Kamu meminum ramuan biru, MP pulih +30.");
      } else if (jenis === "roti") {
        p.roti--;
        p.st = Math.min(p.stMax, p.st + 30);
        Suara.main("heal");
        tulis("Kamu menggigit roti keras berenergi, stamina +30.");
      } else if (jenis === "kabur") {
        p.st -= biaya(8);
        if (Math.random() < 0.5) {
          Suara.main("kabur");
          tulis("Kamu berhasil kabur lewat lorong gelap!");
          return menuUtama();
        }
        Suara.main("gagal");
        tulis("Gagal kabur!");
      }

      if (m.hp <= 0) return menang();
      aksiKawan();
      if (m.hp <= 0) return menang();

      // giliran musuh
      m.giliran++;
      let dmg = rand(Math.max(1, m.atk - 3), m.atk + 3);
      if (Math.random() < 0.15) {
        tulis(`${m.nama} menghindar... lalu menyerang balik dengan keras!`);
        dmg += 4;
      }
      if (m.boss && m.giliran % 3 === 0) {
        tulis(`${m.nama} mengumpulkan tenaga... SERANGAN DAHSYAT!`, "penting");
        dmg = Math.floor(dmg * 1.8);
        Horor.kilat(); Suara.main("jeritan", 0.2);
      }
      dmg = Math.max(1, dmg - ARMOR[p.arm].def);
      p.hp -= dmg;
      Suara.main("kena", 0.35);
      Horor.getar();
      tulis(`${m.nama} menyerang! Kamu kena ${dmg} damage.`);

      if (p.hp <= 0) return kalah();
      if (p.hp < p.hpMax * 0.3) Suara.main("jantung", 0.6);
      menuBattle();
    }

    function menang() {
      m.hp = 0;
      Horor.set(false); document.body.classList.remove("lowhp");
      Suara.main(m.boss ? "menangBoss" : "menang");
      if (m.boss) Suara.musik("diam");
      tulis(`Kamu mengalahkan ${m.nama}! +${m.xp} XP, +${m.gold} Gold`, "penting");
      p.xp += m.xp;
      p.gold += m.gold;
      if (Math.random() < 0.3 * kes.drop) { p.potion++; tulis("Monster menjatuhkan 1 Potion!"); }
      if (Math.random() < 0.15 * kes.drop) { p.ether++; tulis("Monster menjatuhkan 1 Ether!"); }
      if (Math.random() < 0.25 * kes.drop) { p.roti++; tulis("Monster menjatuhkan 1 Roti!"); }
      if (m.nama === NAMBO[0]) {
        p.potion += 2; p.ether++; p.roti++;
        tulis("MONSTER RAHASIA TUMBANG! Nambo Rafif GoG meninggalkan 2 Potion, 1 Ether, 1 Roti!", "penting");
      }
      naikLevel();

      if (m.rahasia) {
        p.tumbang[m.rahasia] = true;
        tulis(`BOSS RAHASIA ${m.nama} telah tumbang! (${Object.keys(p.tumbang).length}/3)`, "penting");
        if (RAHASIA.every(r => p.tumbang[r.id])) {
          p.gelar = "Raja Segala Raja";
          render();
          tulis("*** Ketiga boss rahasia telah kamu kalahkan! ***", "penting");
          tulis(`Seluruh dungeon bersujud. Kamu, ${p.nama}, kini bergelar RAJA SEGALA RAJA!`, "penting");
          tombol([["Lanjut bermain", menuUtama], ["Main lagi", layarKelas]]);
          return;
        }
        return menuUtama();
      }

      if (m.boss) {
        render();
        tulis("SELAMAT! Kamu mengalahkan Naga Raja dan memenangkan game!", "penting");
        tulis(`Namamu, ${p.nama} sang ${p.gelar}, akan dikenang selamanya!`, "penting");
        tulis("Tapi bisik-bisik berkata masih ada 3 boss rahasia... Cari pendamping lewat Toko Budak dan bicaralah dengan mereka.");
        tombol([["Lanjut bermain", menuUtama], ["Main lagi", layarKelas]]);
        return;
      }
      menuUtama();
    }

    function kalah() {
      p.hp = 0;
      Horor.set(true); Horor.getar(); Horor.kilat(); Suara.main("jeritan", 0.3);
      Suara.musik("diam");
      Suara.main("kalah");
      render();
      tulis("GAME OVER... Kamu gugur di dalam dungeon.", "penting");
      tombol([["Main lagi", layarKelas]]);
    }

    // =====================================================
    //   BOSS RAHASIA
    // =====================================================
    function menuRahasia() {
      render();
      tulis("BOSS RAHASIA - gerbang yang dibukakan para pendampingmu:", "pembatas");
      const daftar = RAHASIA.filter(r => p.buka[r.id]).map(r => {
        const [nama, , , , , lv] = r.data;
        const sudah = p.tumbang[r.id];
        return [sudah ? `${nama} (sudah tumbang)` : `${nama} (Level ${lv}+)`,
                () => mulaiBattle(r.data, true, r.id), sudah || p.level < lv];
      });
      daftar.push(["Kembali", menuUtama]);
      tombol(daftar);
    }

    // =====================================================
    //   TOKO BUDAK & BICARA
    // =====================================================
    function menuBudak() {
      render();
      tulis(`TOKO BUDAK - Gold kamu: ${p.gold}`, "pembatas");
      tulis("Pedagang tua berkata: 'Mereka bukan sekadar barang dagangan. Perlakukan dengan baik, dan mereka akan setia padamu.'");
      tulis("Pedagang itu menurunkan suara: 'Kalau mereka mulai berbisik tengah malam, jangan dijawab. Dan jangan hitung jumlah mereka.'", "penting");
      Suara.main("bisik");
      KAWAN.forEach(k => tulis(`${k.nama} (${k.jenis}) - ${k.harga} gold. ${k.efek}`));
      const daftar = KAWAN.map(k => {
        const punya = p.kawan.includes(k.id);
        return [punya ? `${k.nama} (dimiliki)` : `Beli ${k.nama} (${k.harga} gold)`,
                () => beliKawan(k), punya || p.gold < k.harga];
      });
      daftar.push(["Keluar", menuUtama]);
      tombol(daftar);
    }

    function beliKawan(k) {
      p.gold -= k.harga;
      p.kawan.push(k.id);
      p.bicara[k.id] = 0;
      Suara.main("beli");
      tulis(`${k.nama} kini ikut bersamamu! Coba ajak bicara lewat menu 'Bicara dengan Budak'.`, "penting");
      menuBudak();
    }

    function menuBicara() {
      render();
      tulis("Siapa yang ingin kamu ajak bicara? (-3 stamina)", "pembatas");
      const daftar = p.kawan.map(id => {
        const k = KAWAN.find(x => x.id === id);
        return [`Bicara dengan ${k.nama}`, () => bicara(k), p.st < 3];
      });
      daftar.push(["Kembali", menuUtama]);
      tombol(daftar);
    }

    function bicara(k) {
      p.st -= 3;
      const n = p.bicara[k.id] || 0;
      const semua = k.dialog.concat(k.lanjut);
      if (n >= semua.length) {
        tulis(`${k.nama}: 'Aku sudah menceritakan semua yang kutahu, Tuan. Sekarang saatnya bertarung.'`);
      } else {
        tulis(`${k.nama}: ${semua[n]}`, n === 2 ? "penting" : "");
        if (n >= 3) Suara.main("bisik");
        p.bicara[k.id] = n + 1;
        if (n === 2) {
          p.buka[k.rahasia] = true;
          const r = RAHASIA.find(x => x.id === k.rahasia);
          Suara.main("boss");
          tulis(`BOSS RAHASIA TERBUKA: ${r.data[0]}! Cek menu 'BOSS RAHASIA'.`, "penting");
        }
      }
      menuBicara();
    }

    // =====================================================
    //   BERLATIH
    // =====================================================
    function menuLatih() {
      render();
      tulis(`RUANG LATIHAN - 5 gold & ${biaya(10)} stamina per sesi (Critical kini ${p.crit}%, maks ${CRIT_MAKS}%)`, "pembatas");
      const mati = p.gold < 5 || p.st < biaya(10);
      tombol([
        ["Latih Kekuatan (+1 ATK)", () => latih("atk"), mati],
        ["Latih Ketajaman (+2% Critical)", () => latih("crit"), mati || p.crit >= CRIT_MAKS],
        ["Latih Ketahanan (+8 HP max)", () => latih("hp"), mati],
        ["Meditasi Sihir (+5 MP max)", () => latih("mp"), mati],
        ["Kembali", menuUtama]
      ]);
    }

    function latih(jenis) {
      p.gold -= 5;
      p.st -= biaya(10);
      Suara.main("latih");
      if (jenis === "atk") {
        p.atk += 1;
        tulis("Kamu menebas boneka jerami hingga fajar... ATK +1!");
      } else if (jenis === "crit") {
        p.crit = Math.min(CRIT_MAKS, p.crit + 2);
        tulis(`Kamu melatih mata menembus celah pertahanan... Critical jadi ${p.crit}%!`);
      } else if (jenis === "hp") {
        p.hpMax += 8; p.hp += 8;
        tulis("Kamu berdiri di bawah air terjun beku... HP max +8!");
      } else {
        p.mpMax += 5; p.mp += 5;
        tulis("Kamu bermeditasi di lingkaran rune... MP max +5!");
      }
      p.xp += 6;
      tulis("+6 XP dari latihan.");
      naikLevel();

      // risiko: latihan mengundang monster
      if (Math.random() < 0.25) {
        tulis("Suara latihanmu mengundang sesuatu dari kegelapan!", "penting");
        return mulaiBattle(monsterAcak(), false);
      }
      menuLatih();
    }

    // =====================================================
    //   TOKO ALKEMIS & PANDAI BESI
    // =====================================================
    function menuToko() {
      render();
      tulis(`TOKO ALKEMIS & PANDAI BESI - Gold kamu: ${p.gold}`, "pembatas");
      const w = WEAPON[p.wep + 1], a = ARMOR[p.arm + 1];
      tombol([
        ["Potion +50 HP (20 gold)", () => beli("potion"), p.gold < 20],
        ["Ether +30 MP (25 gold)", () => beli("ether"), p.gold < 25],
        ["Roti +30 stamina (15 gold)", () => beli("roti"), p.gold < 15],
        ["Jimat Mata Elang +5% Critical (80 gold)", () => beli("jimat"), p.gold < 80 || p.crit >= CRIT_MAKS],
        w ? [`${w.nama} +${w.atk} ATK (${w.harga} gold)`, () => beli("senjata"), p.gold < w.harga]
          : ["Senjata sudah tingkat maksimal", () => {}, true],
        a ? [`${a.nama} DEF ${a.def}, +${a.hp} HP (${a.harga} gold)`, () => beli("armor"), p.gold < a.harga]
          : ["Armor sudah tingkat maksimal", () => {}, true],
        ["Keluar", menuUtama]
      ]);
    }

    function beli(item) {
      Suara.main("beli");
      if (item === "potion") { p.gold -= 20; p.potion++; tulis("Kamu membeli 1 Potion."); }
      else if (item === "ether") { p.gold -= 25; p.ether++; tulis("Kamu membeli 1 Ether."); }
      else if (item === "roti") { p.gold -= 15; p.roti++; tulis("Kamu membeli 1 Roti."); }
      else if (item === "senjata") {
        const w = WEAPON[++p.wep];
        p.gold -= w.harga;
        tulis(`Pandai besi menempa senjatamu menjadi ${w.nama}! ATK +${w.atk} dari senjata.`);
      } else if (item === "armor") {
        const a = ARMOR[++p.arm];
        p.gold -= a.harga; p.hpMax += a.hp; p.hp += a.hp;
        tulis(`Kamu memakai ${a.nama}! DEF ${a.def}, HP max +${a.hp}.`);
      } else if (item === "jimat") {
        p.gold -= 80;
        p.crit = Math.min(CRIT_MAKS, p.crit + 5);
        tulis(`Jimat berpendar di lehermu! Critical jadi ${p.crit}%!`);
      }
      menuToko();
    }

    // =====================================================
    // aktifkan audio saat pemain pertama kali klik / menekan tombol (aturan browser)
    ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => Suara.init()));

    document.getElementById("btn-musik").onclick = e => {
      e.target.textContent = "Musik: " + (Suara.toggleMusik() ? "ON" : "OFF");
    };
    document.getElementById("btn-suara").onclick = e => {
      e.target.textContent = "Suara: " + (Suara.toggleSuara() ? "ON" : "OFF");
    };

    layarKelas();
  </script>
</body>
</html>
